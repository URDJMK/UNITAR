services:
  - type: web
    name: living-voices-pydantic-agent
    runtime: python
    rootDir: pydantic_agent
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: PYDANTIC_AGENT_SECRET
        generateValue: true
